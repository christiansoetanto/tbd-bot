name: Deploy

on:
  push:
    branches:
      - master

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Inject environment secrets
        run: cp ~/tbd-bot-secrets/.env .env

      - name: Deploy container stack
        run: docker compose up -d --build

      # `docker compose up -d` only recreates containers whose image or config
      # changed. Editing grafana/provisioning/ changes neither: the directory is
      # bind-mounted, so the new files land on disk while Grafana keeps running
      # with whatever it read at startup. That is how the two heartbeat alert
      # rules deployed on 2026-08-03 and were then simply absent. Grafana reads
      # provisioning only at boot, so it needs the restart — and only Grafana
      # does, which keeps a dashboard edit from costing the bot any downtime.
      - name: Reload Grafana provisioning
        run: docker compose restart grafana

      - name: Post-deployment health check
        run: |
          echo "Waiting for container to become healthy..."
          timeout=120
          elapsed=0
          until [ "$elapsed" -ge "$timeout" ]; do
            status=$(docker inspect --format='{{json .State.Health.Status}}' tbd-bot 2>/dev/null || echo '"unknown"')
            if [ "$status" = '"healthy"' ]; then
              echo "Container tbd-bot is healthy!"
              exit 0
            fi
            echo "Container status is $status, waiting..."
            sleep 5
            elapsed=$((elapsed + 5))
          done
          echo "Health check timed out after ${timeout}s!"
          exit 1
